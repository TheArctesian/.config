# Monitor Configuration
# See https://wiki.hyprland.org/Configuring/Monitors/

# Default monitor configuration
# Format: monitor=name,resolution,position,scale
monitor=,preferred,auto,auto

# Example configurations (uncomment and modify as needed):
# Primary monitor at 1920x1080, 144Hz, at position 0,0
# monitor=DP-1,1920x1080@144,0x0,1

# Secondary monitor to the right of primary
# monitor=HDMI-A-1,1920x1080@60,1920x0,1

# Laptop screen with scaling for HiDPI
# monitor=eDP-1,2560x1440@60,0x0,1.25

# Disable a monitor
# monitor=HDMI-A-2,disable

# Mirror mode (same content on multiple monitors)
# monitor=HDMI-A-1,preferred,auto,1,mirror,eDP-1

# Workspace binding to specific monitors
# workspace=1,monitor:DP-1
# workspace=2,monitor:DP-1
# workspace=3,monitor:HDMI-A-1
# workspace=4,monitor:HDMI-A-1