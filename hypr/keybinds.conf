# Keybindings Configuration
# Migrated from sxhkd with Hyprland-specific adaptations

# =========================================
# Core System Controls
# =========================================

# Terminal emulator
bind = $mainMod SHIFT, Return, exec, $terminal

# Application launcher
bind = $mainMod, P, exec, $menu

# Reload Hyprland configuration
bind = $mainMod, Escape, exec, hyprctl reload

# Reload Waybar
bind = $mainMod SHIFT, Escape, exec, ~/.config/waybar/launch.sh

# Change wallpaper randomly
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/scripts/random-wallpaper.sh

bind = ALT SHIFT, L, exec, loginctl lock-session
# Exit Hyprland (logout)
bind = $mainMod SHIFT, Q, exit,

# Kill active window
bind = $mainMod SHIFT, C, killactive,  # Also close with Shift+C

# =========================================
# Window Management
# =========================================

# Focus windows (vim-style navigation)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move windows
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Resize windows
bind = $mainMod ALT, H, resizeactive, -40 0
bind = $mainMod ALT, L, resizeactive, 40 0
bind = $mainMod ALT, K, resizeactive, 0 -40
bind = $mainMod ALT, J, resizeactive, 0 40

# Window states
bind = $mainMod, T, exec, hyprctl dispatch togglefloating  # Tiled (toggle floating off)
bind = $mainMod SHIFT, T, pseudo,  # Pseudotile
bind = $mainMod, S, togglefloating,  # Float (was super+s in sxhkd)
bind = $mainMod, V, togglefloating,  # Additional float toggle
bind = $mainMod, F, fullscreen, 0  # Fullscreen

# Toggle layout (equivalent to bspwm's monocle)
bind = $mainMod, Space, exec, hyprctl dispatch layoutmsg togglesplit

# Split direction control
bind = $mainMod CTRL, H, layoutmsg, splitratio -0.1
bind = $mainMod CTRL, L, layoutmsg, splitratio +0.1
bind = $mainMod CTRL, K, layoutmsg, togglesplit
bind = $mainMod CTRL, J, layoutmsg, swapwithmaster

# =========================================
# Workspace Management
# =========================================

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move window to workspace silently (don't switch to it)
bind = $mainMod CTRL, 1, movetoworkspacesilent, 1
bind = $mainMod CTRL, 2, movetoworkspacesilent, 2
bind = $mainMod CTRL, 3, movetoworkspacesilent, 3
bind = $mainMod CTRL, 4, movetoworkspacesilent, 4
bind = $mainMod CTRL, 5, movetoworkspacesilent, 5
bind = $mainMod CTRL, 6, movetoworkspacesilent, 6
bind = $mainMod CTRL, 7, movetoworkspacesilent, 7
bind = $mainMod CTRL, 8, movetoworkspacesilent, 8
bind = $mainMod CTRL, 9, movetoworkspacesilent, 9
bind = $mainMod CTRL, 0, movetoworkspacesilent, 10

# Navigate workspaces (previous/next)
bind = $mainMod, comma, workspace, -1  # Previous (< key without shift)
bind = $mainMod, period, workspace, +1  # Next (> key without shift)
bind = $mainMod, Left, workspace, -1  # Previous with arrow
bind = $mainMod, Right, workspace, +1  # Next with arrow

# Special workspace (scratchpad)
bind = $mainMod, minus, togglespecialworkspace,
bind = $mainMod SHIFT, minus, movetoworkspace, special

# =========================================
# Application Shortcuts
# =========================================

# Obsidian
bind = $mainMod, O, exec, pgrep -f "obsidian" && hyprctl dispatch focuswindow "title:Obsidian" || obsidian

# Zotero
bind = $mainMod, Z, exec, pgrep -f "zotero" && hyprctl dispatch focuswindow "title:Zotero" || zotero

# Signal
bind = $mainMod, G, exec, pgrep -f "signal" && hyprctl dispatch focuswindow "class:Signal" || signal-desktop

# Slack
bind = $mainMod, M, exec, pgrep -f "slack" && hyprctl dispatch focuswindow "class:Slack" || slack

# Firefox browser
bind = $mainMod, B, exec, pgrep -f "firefox" && hyprctl dispatch focuswindow "class:firefox" || firefox

# Yazi file manager
bind = $mainMod, Y, exec, $terminal --class "yazi,yazi" -e yazi

# Clipboard manager
bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# Markdown cheatsheet scratchpad
bind = $mainMod, A, exec, [float;size 800 600;center] $terminal --class "markdown_cheatsheet,markdown_cheatsheet" -e sh -c "bat ~/.config/sxhkd/cheatsheet.md | less"

# =========================================
# Media Controls
# =========================================

# Volume controls
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness controls
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Media player controls
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# =========================================
# Screenshot Tools
# =========================================

# Interactive area selection with satty annotation (copies image data for GUI apps)
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/hyprshot.sh region

# Screenshot for CLI apps (copies file path as text for Claude Code, etc)
bind = $mainMod ALT, S, exec, ~/.config/hypr/scripts/hyprshot-for-cli.sh region

# Full screenshot
bind = , Print, exec, ~/.config/hypr/scripts/hyprshot.sh output

# Window screenshot
bind = $mainMod, Print, exec, ~/.config/hypr/scripts/hyprshot.sh window

# Delayed screenshot (3 seconds)
bind = CTRL, Print, exec, sleep 3 && grim ~/Pictures/Screenshots/$(date +'%Y%m%d_%H%M%S').png && notify-send "Screenshot saved"

# Screenshot to clipboard (quick, no annotation)
bind = SHIFT, Print, exec, grim - | wl-copy && notify-send "Screenshot copied to clipboard"
bind = $mainMod CTRL, S, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot copied to clipboard"

# =========================================
# Mouse Bindings
# =========================================

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mouse
bindm = $mainMod, mouse:272, movewindow  # Left click
bindm = $mainMod, mouse:273, resizewindow  # Right click

# =========================================
# Window Groups (Tabbed/Stacked)
# =========================================

# Group windows
bind = $mainMod, W, togglegroup
bind = $mainMod SHIFT, W, moveoutofgroup
bind = $mainMod CTRL, W, lockactivegroup, toggle

# Navigate groups
bind = $mainMod, TAB, changegroupactive, f
bind = $mainMod SHIFT, TAB, changegroupactive, b

# =========================================
# Additional Hyprland-specific
# =========================================

# Toggle split direction
bind = $mainMod, R, layoutmsg, togglesplit

# Swap with master window (for master layout)
bind = $mainMod SHIFT, Return, layoutmsg, swapwithmaster

# Focus master window
bind = $mainMod, Return, layoutmsg, focusmaster

# Center floating window
bind = $mainMod, D, centerwindow

# Pin floating window (always on top)
bind = $mainMod, X, pin

# Toggle opacity
bind = $mainMod SHIFT, O, exec, hyprctl setprop active opaque toggle

# Move workspace to monitor
bind = $mainMod SHIFT, comma, movecurrentworkspacetomonitor, -1
bind = $mainMod SHIFT, period, movecurrentworkspacetomonitor, +1

# =========================================
# Laptop Lid Switch Handling
# =========================================

# When lid closes: lock session and turn off display
bindl = , switch:on:Lid Switch, exec, ~/.config/hypr/scripts/lid-switch.sh close

# When lid opens: turn on display
bindl = , switch:off:Lid Switch, exec, ~/.config/hypr/scripts/lid-switch.sh open
