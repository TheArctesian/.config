# Core Variables
# Program definitions and commonly used values

# Terminal emulator
$terminal = ghostty

# File manager
$fileManager = dolphin

# Application launcher
$menu = rofi -show drun

# Browser
$browser = firefox

# Screenshot tools
$screenshot = grim
$screenshot_select = grim -g "$(slurp)"
$screenshot_delay = sleep 3 && grim

# Clipboard manager
$clipboard = cliphist list | rofi -dmenu | cliphist decode | wl-copy

# Main modifier key
$mainMod = SUPER

# Animation speed preference
$animSpeed = 4

# Gap sizes
$gapIn = 5
$gapOut = 10

# Border size
$borderSize = 2

# Rounding radius
$rounding = 10
