# Hyprlock Configuration
# Nord-themed lock screen for Hyprland

# =========================================
# General Settings
# =========================================

general {
    disable_loading_bar = false
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = false
    immediate_render = false
}

# =========================================
# Background
# =========================================

background {
    monitor =
    path = /home/okita/Pictures/wallpaper/nord/fastnet.png
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# =========================================
# Input Field
# =========================================

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1

    # Nord colors
    outer_color = rgb(88c0d0)        # nord8 - Cyan
    inner_color = rgb(3b4252)        # nord1 - Dark background
    font_color = rgb(eceff4)         # nord6 - Light text
    fade_on_empty = false
    fade_timeout = 1000

    # Placeholder
    placeholder_text = <span foreground="##d8dee9"><i>Enter Password...</i></span>

    # Failed attempts
    fail_color = rgb(bf616a)         # nord11 - Red
    fail_text = <span foreground="##bf616a">$FAIL <b>($ATTEMPTS)</b></span>
    fail_timeout = 2000
    fail_transition = 300

    # Capslock
    capslock_color = rgb(ebcb8b)     # nord13 - Yellow
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false

    # Position
    position = 0, -120
    halign = center
    valign = center

    # Rounding
    rounding = 10

    check_color = rgb(a3be8c)        # nord14 - Green

    hide_input = false
}

# =========================================
# Time Display
# =========================================

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(88c0d0)              # nord8 - Cyan
    font_size = 120
    font_family = JetBrainsMono Nerd Font

    position = 0, 200
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb(2e3440)       # nord0
    shadow_boost = 1.2
}

# =========================================
# Date Display
# =========================================

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgb(d8dee9)              # nord4 - Light foreground
    font_size = 24
    font_family = JetBrainsMono Nerd Font

    position = 0, 80
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb(2e3440)       # nord0
}

# =========================================
# User Display
# =========================================

label {
    monitor =
    text = cmd[update:1000] echo "Welcome $USER"
    color = rgb(81a1c1)              # nord9 - Light blue
    font_size = 18
    font_family = JetBrainsMono Nerd Font

    position = 0, -10
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb(2e3440)       # nord0
}

# =========================================
# Current Layout Indicator (Optional)
# =========================================

label {
    monitor =
    text = cmd[update:1000] echo "$(hyprctl devices -j | jq -r '.keyboards[] | select(.main == true) | .active_keymap' | head -n1 || echo 'us')"
    color = rgb(d8dee9)              # nord4
    font_size = 14
    font_family = JetBrainsMono Nerd Font

    position = 0, -260
    halign = center
    valign = center
}

# =========================================
# Battery Status (for laptops)
# =========================================

label {
    monitor =
    text = cmd[update:5000] echo " $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo 'N/A')%"
    color = rgb(a3be8c)              # nord14 - Green
    font_size = 16
    font_family = JetBrainsMono Nerd Font

    halign = left
    valign = bottom

    position = 10, 40
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb(2e3440)       # nord0
}

# =========================================
# System Info (Optional)
# =========================================

label {
    monitor =
    text = cmd[update:5000] echo " $(cat /proc/sys/kernel/hostname)"
    color = rgb(b48ead)              # nord15 - Purple
    font_size = 14
    font_family = JetBrainsMono Nerd Font

    position = 10, 10
    halign = left 
    valign = bottom

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb(2e3440)       # nord0
}
