# Hypridle Configuration
# Idle management for Hyprland with screen lock

# =========================================
# General Settings
# =========================================

general {
    lock_cmd = pidof hyprlock || hyprlock       # Avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # Lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on && sleep 0.2 && hyprctl reload  # Turn on screen, wait, and refresh monitors after resume
    ignore_dbus_inhibit = false                 # Respect inhibitors (e.g., watching videos)
}

# Note: hyprlock will be triggered by loginctl lock-session via systemd

# =========================================
# Idle Listeners
# =========================================

# Dim screen after 2.5 minutes of inactivity
listener {
    timeout = 150                               # 2.5 minutes
    on-timeout = brightnessctl -s set 10%       # Set brightness to 10% and save current value
    on-resume = brightnessctl -r                # Restore previous brightness
}

# Turn off keyboard backlight after 2.5 minutes
listener {
    timeout = 150                               # 2.5 minutes
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0  # Turn off keyboard backlight
    on-resume = brightnessctl -rd rgb:kbd_backlight         # Restore keyboard backlight
}

# Lock screen after 5 minutes of inactivity
listener {
    timeout = 300                               # 5 minutes
    on-timeout = hyprlock          # Lock the session (triggers hyprlock)
}

# Turn off screen after 6 minutes of inactivity (while locked)
listener {
    timeout = 360                               # 6 minutes
    on-timeout = hyprctl dispatch dpms off      # Turn off screen
    on-resume = hyprctl dispatch dpms on        # Turn on screen when activity is detected
}

# Suspend system after 30 minutes of inactivity
listener {
    timeout = 1800                              # 30 minutes
    on-timeout = systemctl suspend              # Suspend the system
}
