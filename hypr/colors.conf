# Nord Color Palette
# https://www.nordtheme.com/

# Polar Night - Dark backgrounds
$nord0 = rgb(2e3440)  # Darkest
$nord1 = rgb(3b4252)
$nord2 = rgb(434c5e)
$nord3 = rgb(4c566a)  # Lightest dark

# Snow Storm - Light foregrounds
$nord4 = rgb(d8dee9)  # Darkest light
$nord5 = rgb(e5e9f0)
$nord6 = rgb(eceff4)  # Lightest

# Frost - Blue/Cyan palette
$nord7 = rgb(8fbcbb)  # Teal
$nord8 = rgb(88c0d0)  # Cyan
$nord9 = rgb(81a1c1)  # Light blue
$nord10 = rgb(5e81ac) # Blue

# Aurora - Accent colors
$nord11 = rgb(bf616a) # Red
$nord12 = rgb(d08770) # Orange
$nord13 = rgb(ebcb8b) # Yellow
$nord14 = rgb(a3be8c) # Green
$nord15 = rgb(b48ead) # Purple

# Additional colors with alpha for transparency
$nord0_alpha = rgba(2e3440ee)
$nord1_alpha = rgba(3b4252ee)
$nord3_alpha = rgba(4c566aaa)
$nord8_alpha = rgba(88c0d0ee)
$nord9_alpha = rgba(81a1c1ee)