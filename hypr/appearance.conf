# Appearance Configuration
# Look and feel settings with Nord theme

# General appearance settings
general {
    gaps_in = $gapIn
    gaps_out = $gapOut
    border_size = $borderSize
    
    # Nord-themed border colors
    col.active_border = $nord8_alpha $nord9_alpha 45deg
    col.inactive_border = $nord3_alpha
    
    # Layout
    layout = dwindle
    
    # Tearing
    allow_tearing = false
    
    # Resize on border
    resize_on_border = true
}

# Window decorations
decoration {
    # Rounded corners
    rounding = $rounding
    
    # Shadows - Nord-themed
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = $nord0_alpha
        color_inactive = rgba(00000033)
    }
    
    # Blur
    blur {
        enabled = true
        size = 8
        passes = 3
        xray = false
        noise = 0.0117
        contrast = 0.8916
        brightness = 0.8172
        vibrancy = 0.1696
        vibrancy_darkness = 0.0
        special = false
        popups = true
    }
}

# Cursor settings - Nordzy theme
cursor {
    inactive_timeout = 5
    no_warps = false
    hide_on_key_press = false
    hide_on_touch = true
}

# Animations
animations {
    enabled = yes
    
    # Bezier curves
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1.0
    bezier = quick, 0.15, 0, 0.1, 1
    
    # Animation rules
    animation = windows, 1, $animSpeed, easeOutQuint, popin 87%
    animation = windowsIn, 1, $animSpeed, easeOutQuint, popin 87%
    animation = windowsOut, 1, 2, linear, popin 87%
    animation = windowsMove, 1, $animSpeed, easeOutQuint
    animation = border, 1, 5, easeOutQuint
    animation = fade, 1, 3, quick
    animation = fadeIn, 1, 3, almostLinear
    animation = fadeOut, 1, 2, almostLinear
    animation = fadeSwitch, 1, 3, easeInOutCubic
    animation = fadeShadow, 1, 5, easeOutQuint
    animation = fadeDim, 1, 4, easeOutQuint
    animation = workspaces, 1, $animSpeed, easeOutQuint, fade
}

# Miscellaneous visual settings
misc {
    # Wallpaper
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    
    # Mouse
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    
    # Window swallowing
    enable_swallow = true
    swallow_regex = ^(ghostty|kitty|alacritty)$
    
    # Focus
    layers_hog_keyboard_focus = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    
    # VRR (Variable Refresh Rate)
    vrr = 1
    
    # Other
    disable_autoreload = false
    focus_on_activate = true
}
