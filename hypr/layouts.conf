# Layout Configuration
# Window tiling and layout settings

# Dwindle layout (default)
dwindle {
    # Tiling behavior
    pseudotile = true  # Enable pseudotiling
    preserve_split = true  # Preserve split direction
    force_split = 0  # 0 = split follows mouse, 1 = always left/top, 2 = always right/bottom
    
    # Smart splitting
    smart_split = false
    smart_resizing = true
    
    # Special workspace scaling
    special_scale_factor = 0.8
    
    # Use active window for splits
    use_active_for_splits = true
}

# Master layout configuration
master {
    # New window position
    new_status = inherit  # inherit, master, or slave
    new_on_top = false
    
    # Master area
    mfact = 0.55  # Master area size (0.0-1.0)
    
    # Orientation
    orientation = left  # left, right, top, bottom, center
    
    # Inherit fullscreen status
    inherit_fullscreen = true
    
    # Smart resizing
    smart_resizing = true
    
    # Special workspace scaling
    special_scale_factor = 0.8
}

# Group (tabbed/stacked) configuration
group {
    insert_after_current = true
    focus_removed_window = true
    
    # Group bar
    groupbar {
        enabled = true
        font_family = JetBrainsMono Nerd Font
        font_size = 10
        height = 20
        
        # Colors from Nord palette
        text_color = $nord6
        col.active = $nord8_alpha
        col.inactive = $nord3_alpha
        
        # Gradients
        gradients = true
        render_titles = true
        scrolling = true
    }
}

# Binds for layout operations (defined in keybinds.conf)
# These are referenced here for documentation

# Layout switching: $mainMod + SPACE
# Toggle split: $mainMod + J
# Pseudotile: $mainMod + P
# Grouping: $mainMod + G (create), $mainMod + SHIFT + G (destroy)
# Tab switching: $mainMod + TAB (next), $mainMod + SHIFT + TAB (prev)