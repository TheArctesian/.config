# Window and Workspace Rules
# Application-specific behavior and workspace assignments

# =========================================
# Window Rules
# =========================================

# General rules
windowrule = suppressevent maximize, class:.*  # Ignore maximize requests
windowrule = nofocus, class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0  # Fix XWayland dragging

# Floating windows by default
# Rofi and dmenu
windowrulev2 = float, class:^(Rofi)$
windowrulev2 = animation popin, class:^(Rofi)$
windowrulev2 = stayfocused, class:^(Rofi)$
windowrulev2 = pin, class:^(Rofi)$

# Terminal scratchpads and special windows
windowrulev2 = float, class:^(markdown_cheatsheet)$
windowrulev2 = size 800 600, class:^(markdown_cheatsheet)$
windowrulev2 = center, class:^(markdown_cheatsheet)$

windowrulev2 = float, class:^(yazi)$
windowrulev2 = size 1200 800, class:^(yazi)$
windowrulev2 = center, class:^(yazi)$

# Firefox
windowrulev2 = float, class:^(firefox)$,title:^(Library)$
windowrulev2 = float, class:^(firefox)$,title:^(Firefox - Sharing Indicator)$
windowrulev2 = float, class:^(firefox)$,title:^(Picture-in-Picture)$

# Obsidian
windowrulev2 = workspace 2, class:^(obsidian)$
windowrulev2 = tile, class:^(obsidian)$

# Zotero
windowrulev2 = workspace 2, class:^(Zotero)$
windowrulev2 = tile, class:^(Zotero)$

# Communication apps
windowrulev2 = workspace 9, class:^(Signal)$
windowrulev2 = workspace 9, class:^(slack)$
windowrulev2 = workspace 9, class:^(discord)$
windowrulev2 = workspace 9, class:^(Element)$

# Development
windowrulev2 = workspace 3, class:^(Code)$
windowrulev2 = workspace 3, class:^(code-url-handler)$
windowrulev2 = workspace 3, class:^(jetbrains-).*$

# Media
windowrulev2 = workspace 8, class:^(mpv)$
windowrulev2 = workspace 8, class:^(vlc)$
windowrulev2 = workspace 8, title:^(Spotify)$
windowrulev2 = float, class:^(mpv)$
windowrulev2 = size 1280 720, class:^(mpv)$
windowrulev2 = center, class:^(mpv)$

# Games
windowrulev2 = fullscreen, class:^(steam_app_).*$
windowrulev2 = workspace 10, class:^(steam)$
windowrulev2 = workspace 10, class:^(lutris)$

# Image viewers
windowrulev2 = float, class:^(imv)$
windowrulev2 = float, class:^(feh)$
windowrulev2 = center, class:^(imv)$
windowrulev2 = center, class:^(feh)$

# System monitoring
windowrulev2 = float, class:^(btop)$
windowrulev2 = float, class:^(htop)$
windowrulev2 = size 1200 800, class:^(btop)$
windowrulev2 = center, class:^(btop)$

# OBS Studio
windowrulev2 = workspace 7, class:^(obs)$
windowrulev2 = float, class:^(obs)$,title:^(Settings)$

# File managers
windowrulev2 = float, class:^(thunar)$
windowrulev2 = float, class:^(dolphin)$
windowrulev2 = float, class:^(nemo)$
windowrulev2 = size 1200 800, class:^(thunar)$
windowrulev2 = center, class:^(thunar)$

# Opacity rules
windowrulev2 = opacity 0.95 0.85, class:^(alacritty)$
windowrulev2 = opacity 0.95 0.85, class:^(Code)$

# Note: Blur is applied globally to transparent windows via decoration:blur in appearance.conf
# Individual window blur cannot be controlled per-window in Hyprland

# Animation rules
windowrulev2 = animation slide, class:^(rofi)$
windowrulev2 = animation slide, class:^(dunst)$
windowrulev2 = animation popin 80%, class:^(thunar)$
windowrulev2 = animation popin 80%, class:^(dolphin)$

# =========================================
# Workspace Rules
# =========================================

# Default workspace behaviors
workspace = 1, monitor:DP-1, default:true
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1

# Secondary monitor workspaces (if available)
workspace = 6, monitor:HDMI-A-1, default:true
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1

# Special workspace
workspace = special:scratchpad, gapsin:20, gapsout:20

# =========================================
# Layer Rules
# =========================================

# Notifications
layerrule = blur, notifications
layerrule = ignorezero, notifications
layerrule = animation slide, notifications

# Rofi
layerrule = blur, rofi
layerrule = ignorezero, rofi
layerrule = animation slide, rofi

# Waybar/Polybar
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = animation slide top, waybar
