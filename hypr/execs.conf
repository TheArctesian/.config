# Autostart Configuration
# Applications and services to launch with Hyprland

# =========================================
# Core System Services
# =========================================

# Polkit authentication agent
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Notification daemon
exec-once = dunst

# Network manager applet
exec-once = nm-applet --indicator

# Bluetooth manager
exec-once = blueman-applet

# =========================================
# Desktop Environment
# =========================================

# Status bar
# exec-once = ~/.config/polybar/scripts/launch.sh  # Replaced with Waybar
exec-once = ~/.config/waybar/launch.sh

# Wallpaper manager
exec-once = hyprpaper &

# Set random wallpaper on startup
# Clipboard manager
exec-once = wl-paste --type text --watch cliphist store  # Store text data
exec-once = wl-paste --type image --watch cliphist store  # Store image data

# Idle management
exec-once = hypridle

# Screen lock is triggered by hypridle/loginctl, not run at startup
# exec-once = hyprlock

# =========================================
# System Tray Applications
# =========================================

# Volume control
exec-once = pasystray

# Power management is handled by power-profiles-daemon (NixOS systemd service)
# Removed xfce4-power-manager to avoid conflicts with power-profiles-daemon

# =========================================
# Background Services
# =========================================

# XDG portals are handled by systemd user session (configured in framework.nix)
# Removed manual portal starts to avoid conflicts

# Start XWayland
# exec-once = xwaylandvideobridge

# Keyring
exec-once = gnome-keyring-daemon --start --components=secrets

# =========================================
# User Applications (Optional)
# =========================================

# Autostart user applications (uncomment as needed)
# exec-once = firefox
# exec-once = signal-desktop --start-in-tray
# exec-once = slack --startup
# exec-once = obsidian

# =========================================
# Scripts and Utilities
# =========================================

# Cursor theme
exec-once = hyprctl setcursor Nordzy-cursors 24

# Import GTK settings
exec-once = gsettings set org.gnome.desktop.interface gtk-theme "Nordic-darker"
exec-once = gsettings set org.gnome.desktop.interface icon-theme "Nordzy-dark"
exec-once = gsettings set org.gnome.desktop.interface cursor-theme "Nordzy-cursors"
exec-once = gsettings set org.gnome.desktop.interface font-name "JetBrainsMono Nerd Font 11"

# =========================================
# One-time Setup Commands
# =========================================

# Set default browser
exec-once = xdg-settings set default-web-browser firefox.desktop

# =========================================
# Session-specific
# =========================================

# Start terminal in workspace 1 (optional)
exec-once = [workspace 1 silent] $terminal
exec-once = [workspace 2 silent] firefox
exec-once = [workspace 3 silent] brave
# exec-once = [workspace 4 silent] librewolf
exec-once = [workspace 5 silent] signal-desktop 
exec-once = [workspace 6 silent] zotero
exec-once = [workspace 10 silent] spotify

# Focus workspace 1 on startup
exec-once = hyprctl dispatch workspace 1
