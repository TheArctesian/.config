# Input Configuration
# Keyboard, mouse, and touchpad settings

input {
    # Keyboard configuration
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = caps:escape  # Map Caps Lock to Escape
    kb_rules =
    
    # Key repeat settings
    repeat_rate = 50
    repeat_delay = 300
    
    # Numlock on startup
    numlock_by_default = true
    
    # Mouse configuration
    follow_mouse = 1  # Focus follows mouse (1 = yes, 2 = always)
    mouse_refocus = true
    
    # Mouse sensitivity (range: -1.0 to 1.0)
    sensitivity = 0
    accel_profile = flat
    
    # Scroll settings
    natural_scroll = false
    
    # Focus behavior
    float_switch_override_focus = 1
    
    # Touchpad configuration
    touchpad {
        natural_scroll = true
        disable_while_typing = true
        clickfinger_behavior = true
        middle_button_emulation = false
        tap-to-click = true
        drag_lock = false
        scroll_factor = 1.0
    }
}

# Gestures configuration
gestures {
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 30
    workspace_swipe_cancel_ratio = 0.5
    workspace_swipe_create_new = true
    workspace_swipe_forever = false
    workspace_swipe_use_r = false
}

# Per-device configuration examples
# Uncomment and modify as needed

# Gaming mouse with different sensitivity
# device {
#     name = razer-razer-deathadder-v3
#     sensitivity = -0.5
#     accel_profile = flat
# }

# Specific keyboard layout for external keyboard
# device {
#     name = keychron-keychron-k2
